<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anshika's 27th Nov Special ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff0080; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-shell { width: 100%; max-width: 400px; height: 100vh; position: relative; }
        .slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); padding: 20px; }
        .slide.active { opacity: 1; pointer-events: auto; }
        .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 40px; text-align: center; width: 85%; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .photo-frame { width: 100%; height: 300px; border-radius: 30px; border: 3px solid var(--accent); object-fit: cover; margin-bottom: 20px; box-shadow: 0 0 20px rgba(255,0,128,0.3); }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .nav-btn { background: rgba(255,255,255,0.15); border: none; padding: 12px 25px; color: white; border-radius: 50px; cursor: pointer; }
        .primary-btn { background: var(--accent); padding: 15px 30px; border-radius: 50px; border: none; color: white; font-weight: bold; width: 100%; margin-top: 15px; }
        #lock-screen { position: fixed; inset: 0; z-index: 1000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<audio id="bdayTune" src="birthday.mp3"></audio>
<audio id="romanticTune" src="romantic.mp3" loop></audio>

<!-- Lock Screen -->
<div id="lock-screen">
    <h2 style="color:var(--accent)">Anshika's Special 27 Nov ✨</h2>
    <input type="password" id="pass" placeholder="Enter Secret Key" style="padding:15px; border-radius:20px; border:1px solid var(--accent); background:transparent; color:white; text-align:center; margin-bottom:15px; width:200px;">
    <button class="primary-btn" style="width:200px" onclick="unlock()">Unlock Magic</button>
</div>

<div class="app-shell">
    <!-- Slide 1: Welcome -->
    <div class="slide active">
        <div class="card">
            <h1>Happy Birthday, Anshika! 🎂</h1>
            <p>27th November is special, just like you.</p>
            <button class="primary-btn" onclick="next()">Start Journey</button>
        </div>
    </div>

    <!-- Slides 2-8: Photo Gallery + Quiz -->
    <script>
        const gallery = ["", "Hamesha khilkhilati raho 😊", "Humari dosti ki yaadein 🤝", "Tumhara muskurana life hai ❤️", "Best partner ever! 🌟", "Family goals! 🏡", "My heart beats for you! ✨", "Sari khushiyan tumhare naam"];
        for(let i=1; i<=7; i++) {
            document.write(`
                <div class="slide">
                    <img src="anshika${i}.jpg" class="photo-frame">
                    <div class="card">
                        <p>${gallery[i]}</p>
                        <div class="btn-group">
                            <button class="nav-btn" onclick="prev()">Back</button>
                            <button class="nav-btn" onclick="next()">Next</button>
                        </div>
                    </div>
                </div>
            `);
        }
    </script>

    <!-- Slide 9: Promise -->
    <div class="slide">
        <div class="card">
            <h3>Future & Promise 💫</h3>
            <p>Zindagi ki har mushkil mein main tumhara humsafar banke khada rahunga.</p>
            <button class="primary-btn" onclick="next()">Confirm Promise</button>
        </div>
    </div>

    <!-- Final Slide -->
    <div class="slide">
        <div class="card">
            <h1>Stay Mine Forever ❤️</h1>
            <p>Dosti se shuru hua ye rishta, kya tum isse life-partner tak le jana chahogi?</p>
            <button class="primary-btn" onclick="finalCeleb()">YES, FOREVER! 🎉</button>
        </div>
    </div>
</div>

<script>
    let current = 0;
    const slides = document.querySelectorAll('.slide');
    const bday = document.getElementById('bdayTune');
    const rom = document.getElementById('romanticTune');

    function unlock() {
        if(document.getElementById('pass').value === "KBBKB2") {
            document.getElementById('lock-screen').style.display = 'none';
            bday.play();
        } else { alert("Galat Key! 😉"); }
    }

    function next() {
        if(current < slides.length - 1) {
            slides[current].classList.remove('active');
            current++;
            slides[current].classList.add('active');
            if(current === 8) { bday.pause(); rom.play(); }
            confetti({ particleCount: 50, spread: 30 });
        }
    }

    function prev() {
        if(current > 0) {
            slides[current].classList.remove('active');
            current--;
            slides[current].classList.add('active');
        }
    }

    function finalCeleb() {
        confetti({ particleCount: 1000, spread: 360, origin: { y: 0.5 } });
        alert("Happy Birthday Anshika! Love you to the moon and back.");
    }
</script>
</body>
</html>
